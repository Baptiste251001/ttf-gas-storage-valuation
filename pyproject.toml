[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gasstorage"
version = "0.1.0"
description = "Valuation and hedging of a TTF natural gas storage contract: intrinsic LP/DP, LSMC extrinsic value, greeks and delta hedging."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Baptiste Malard" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "requests>=2.31"]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-cov>=5.0", "jupyterlab>=4.0", "ipykernel>=6.29"]
fast = ["numba>=0.59"]

[tool.hatch.build.targets.wheel]
packages = ["src/gasstorage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = [
    "N803", # allow math-style argument names (e.g. T, F, S)
    "N806", # allow math-style variable names
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running Monte Carlo tests (deselect with -m 'not slow')"]
